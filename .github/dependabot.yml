# Weekly pull requests to update the GitHub Actions and the submodules in
# src/thirdparty/. CI tests them like any other pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps) # pull request titles must be Conventional Commits
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      submodules:
        patterns: ["*"]
