name: Template

# Only in the template: scripts/template-init.sh deletes this file, with
# template/ and itself. It runs template-init on copies of the template,
# keeping every part, without each one, without any, and with each license,
# and checks what it makes (template/test.sh): a marker or a line it can't
# find, a placeholder left, a broken build, workflow or script fails it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run that's testing the code it
# replaces
concurrency:
  group: template-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # What a project needs to build and test, zsh and fish for its
      # completions, and actionlint for its workflows (shellcheck is there)
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y liblua5.4-dev zsh fish
          pipx install actionlint-py==1.7.12.25

      - name: Check the test
        run: shellcheck template/test.sh

      - name: Initialize and check
        run: template/test.sh
