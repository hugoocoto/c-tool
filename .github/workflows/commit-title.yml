name: Commit title

# Pull requests are squashed, and their title becomes the commit on main, so
# it must be a Conventional Commit (scripts/check-commit.sh). On its own, so
# that editing a title doesn't run all of CI again.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-commit.sh "$TITLE"
