name: CI

# Every push and PR runs the tests. A push to main also refreshes the
# "nightly" release, and a v* tag (see scripts/release.sh) makes a release of
# its own. Both have, for x86_64 and aarch64, the AppImage and a static (musl)
# binary, plus a source tarball, the shell completions, the man page, the docs
# PDFs, the changelog and their checksums, and are only published if every test passes.
# Their files are attested (signed as built by this workflow), which is what
# scripts/install.sh checks, and it is run on them once they're published.
# Their notes are their part of the changelog (scripts/changelog.sh).

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  DEPS: liblua5.4-dev

jobs:
  test:
    # Memory errors, leaks and undefined behavior in one run, data races in
    # the other (ThreadSanitizer can't be combined with AddressSanitizer)
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        sanitize: ["address,undefined", thread]
    name: test (${{ matrix.cc }}, ${{ matrix.sanitize }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0 # git describe needs the tags, for the version

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y $DEPS

      # The runners randomize addresses more than the sanitizers can handle
      # ("FATAL: ThreadSanitizer: unexpected memory mapping")
      - name: Make the sanitizers work
        run: sudo sysctl vm.mmap_rnd_bits=28

      # WERROR=1: a new warning fails CI, not only shows up in its log
      - name: Build
        run: make CC=${{ matrix.cc }} WERROR=1

      - name: Test
        run: make test CC=${{ matrix.cc }} SANITIZE=${{ matrix.sanitize }} WERROR=1

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # The version in the Makefile: others may format differently
      - name: Install clang-format
        run: pip install "clang-format==$(sed -n 's/^CLANG_FORMAT_VERSION := //p' Makefile)"

      - name: Check the format
        run: make check-format

      # A glob, not names: the init script deletes itself
      - name: Check the scripts
        run: shellcheck scripts/*.sh scripts/hooks/*

  # The paths no test runs: clang's static analyzer (see `make analyze`)
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y $DEPS

      - name: Analyze
        run: make analyze

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3.0
        with:
          typst-version: 0.15.1 # a new one could change the PDFs, or break them

      - name: Build PDFs
        run: make docs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: docs/**/*.pdf
          if-no-files-found: ignore

  package:
    # The oldest runners: the AppImage needs a glibc at least as new as the
    # one it was built with, so this makes it run on more systems. The static
    # binary has no such limit.
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            make: appimage static dist completions man # the arch-independent ones only once
          - runner: ubuntu-22.04-arm
            arch: aarch64
            make: appimage static
    name: package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y $DEPS musl-tools

      # The pinned tools and Lua (see the Makefile), checked before every use
      # whether they come from here or from the download
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/tools/downloads
          key: downloads-${{ matrix.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: downloads-${{ matrix.arch }}-

      - name: Build
        run: make ${{ matrix.make }} WERROR=1

      # What gets released works, before it's released
      - name: Check the release files
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1 # the runners have no FUSE
        run: |
          shopt -s nullglob
          version=$(make -s version)
          for bin in ./*-static ./*.AppImage; do
            echo "$bin --version: $("$bin" --version)"
            [[ $("$bin" --version) == *" $version" ]]
          done
          for bin in ./*-static; do
            file -b "$bin" | grep -E 'statically linked|static-pie linked'
            "$bin" --config config.lua
          done
          for man in ./*.1; do
            grep -q "$version" "$man"
          done
          # The source tarball builds on its own, and knows its version
          for src in ./*.tar.gz; do
            [[ $src != *-completions.tar.gz ]] || continue
            tar -xzf "$src" -C "$RUNNER_TEMP"
            dir=$RUNNER_TEMP/$(basename "$src" .tar.gz)
            make -C "$dir"
            name=$(basename "$src" "-$version.tar.gz")
            echo "built from $src: $("$dir/$name" --version)"
            [[ $("$dir/$name" --version) == "$name $version" ]]
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: |
            *.AppImage
            *-static
            *.tar.gz
            *.1

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, format, analyze, docs, package]
    # Never stopped halfway: nightly is deleted and made again
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # for the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Changelog
        run: |
          scripts/changelog.sh >release/CHANGELOG.md
          # The release's notes are its own section, without its title line
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            scripts/changelog.sh "$GITHUB_REF_NAME" | tail -n +3 >notes.md
          else
            changes=$(scripts/changelog.sh HEAD | tail -n +3)
            {
              echo "Built from $GITHUB_SHA on $(date -u '+%Y-%m-%d %H:%M UTC'). It changes with every push to main."
              echo
              echo "${changes:-No changes since the last release.}"
            } >notes.md
          fi

      - name: Checksums
        run: |
          # PDFs from docs/ subfolders keep their folders: flatten them
          find release -mindepth 2 -type f -exec mv -t release {} +
          find release -mindepth 1 -type d -delete
          # The install script too, so it's attested like the rest: what the
          # README runs is releases/latest/download/install.sh
          cp scripts/install.sh release/
          cd release && sha256sum * >SHA256SUMS

      # Proof that these files were built here, from this commit: install.sh
      # checks SHA256SUMS with `gh attestation verify`, and SHA256SUMS the rest
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: release/*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
            exit
          fi
          # The tag moves here, and the release's files are replaced in place:
          # deleting it and making it again would leave a moment without it.
          # SHA256SUMS goes last, so an install in between finds files newer
          # than their checksums, and install.sh tries again.
          version=$(git describe --tags --match 'v*' --always)
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin nightly
          if ! gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create nightly release/* --repo "$GITHUB_REPOSITORY" --prerelease --verify-tag \
              --title "Nightly $version" --notes-file notes.md
            exit
          fi
          cd release
          gh release upload nightly $(ls | grep -vx SHA256SUMS) --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload nightly SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          # The files this build doesn't have, like the last one's source tarball
          gh release view nightly --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' |
            while read -r asset; do
              [ -e "$asset" ] || gh release delete-asset nightly "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done
          # Its date stays the first one's: the notes say when this was built
          gh release edit nightly --repo "$GITHUB_REPOSITORY" --title "Nightly $version" --notes-file ../notes.md

  install:
    # scripts/install.sh, on the release just published, as users run it
    needs: release
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install, switch to the AppImage and back, uninstall
        env:
          GH_TOKEN: ${{ github.token }} # gh attestation verify needs a login
          REPO: ${{ github.repository }}
          APPIMAGE_EXTRACT_AND_RUN: 1 # the runners have no FUSE
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] && tag=$GITHUB_REF_NAME || tag=nightly
          name=$(sed -n 's/^NAME := //p' Makefile)
          version=$(make -s version)
          install=$PWD/scripts/install.sh
          cd "$RUNNER_TEMP"
          export PREFIX=prefix # relative on purpose
          # --strict: no attestation fails
          bash "$install" --yes --strict "$tag"
          [[ $(prefix/bin/$name --version) == "$name $version" ]]
          test -f "prefix/share/man/man1/$name.1"
          test -f "prefix/share/bash-completion/completions/$name"
          bash "$install" --yes --strict --appimage "$tag"
          [[ $(prefix/bin/$name --version) == "$name $version" ]]
          test -f "prefix/share/applications/$name.desktop"
          # The AppImage is installed, so it's what's suggested now
          bash "$install" --yes --strict "$tag"
          test -f "prefix/share/applications/$name.desktop"
          bash "$install" --yes --strict --static "$tag"
          test ! -e "prefix/share/applications/$name.desktop"
          bash "$install" --yes uninstall
          [ -z "$(find prefix -type f)" ]

      - name: The release's install.sh is this one, and attested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] && tag=$GITHUB_REF_NAME || tag=nightly
          curl -fsSL -o "$RUNNER_TEMP/install.sh" "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/install.sh"
          cmp "$RUNNER_TEMP/install.sh" scripts/install.sh
          gh attestation verify "$RUNNER_TEMP/install.sh" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"

      - name: Install as root, to /usr/local
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] && tag=$GITHUB_REF_NAME || tag=nightly
          name=$(sed -n 's/^NAME := //p' Makefile)
          sudo --preserve-env=GH_TOKEN,REPO bash scripts/install.sh --yes --strict "$tag"
          test -x "/usr/local/bin/$name"
          sudo --preserve-env=REPO bash scripts/install.sh --yes uninstall
          test ! -e "/usr/local/bin/$name"
